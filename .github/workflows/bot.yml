name: Run Telegram Bot

on:
  schedule:
    # Run every 5 hours (before the 6-hour GitHub Actions timeout)
    - cron: '0 */5 * * *'
  workflow_dispatch:

concurrency:
  group: soft4p-bot-instance
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies (ffmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare Environment and Run Bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          OWNER_ID: ${{ secrets.OWNER_ID }}
          USERBOT_API_ID: ${{ secrets.USERBOT_API_ID }}
          USERBOT_API_HASH: ${{ secrets.USERBOT_API_HASH }}
          USERBOT_CHANNEL_ID: ${{ secrets.USERBOT_CHANNEL_ID }}
          TELETHON_SESSION: ${{ secrets.TELETHON_SESSION }}
          COOKIES_CONTENT: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          if [ -n "$COOKIES_CONTENT" ]; then
            echo "$COOKIES_CONTENT" > cookies.txt
            echo "Loaded cookies.txt from secrets."
          fi
          
          # Run bot with a safe timeout of 5h 50m (to cleanly cycle before GitHub hard cancels)
          timeout 21000 python bot.py || true
